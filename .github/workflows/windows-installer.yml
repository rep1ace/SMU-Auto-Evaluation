name: Build and publish Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New release tag (for example, v1.0.1)"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        id: version
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq "workflow_dispatch") { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must have the form v1.2.3."
          }
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $existing = git ls-remote --tags origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Cannot check existing release tags." }
            if ($existing) { throw "Tag $tag already exists. Choose a new version." }
          }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "Cannot determine the source commit." }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Run tests
        shell: pwsh
        env:
          PYSTRAY_BACKEND: dummy
        run: |
          uv sync --group build
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed." }
          uv run pytest -q
          if ($LASTEXITCODE -ne 0) { throw "Tests failed." }
      - name: Build application and installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./build.ps1 -Version $env:APP_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: SMU-Auto-Evaluation-Windows
          path: dist-installer/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SMU-Auto-Evaluation-Windows
          path: installer
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          shopt -s nullglob
          installers=(installer/*.exe)
          if (( ${#installers[@]} == 0 )); then
            echo "No Windows installer was downloaded." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${installers[@]}" \
            --target "$RELEASE_COMMIT" \
            --title "$RELEASE_TAG" \
            --generate-notes
